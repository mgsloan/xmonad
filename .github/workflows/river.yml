name: River

# The river backend and the consistency checks that protect it.
#
# Kept separate from the Stack workflow rather than folded into its resolver
# matrix, for two reasons.  The river backend targets one resolver -- the one
# in stack.yaml -- because it depends on store-core and network and there is no
# value in proving it builds on GHC 8.6.  And the checks below are not a build:
# they compare the two backends against each other and against a recorded
# baseline, so they need both halves built in the same job, which a matrix
# entry cannot express.
#
# Before this existed, every line under src/ was uncompiled in CI, the
# river-wire suite never ran, and none of the consistency scripts ran
# anywhere -- they only protected the tree when someone remembered to invoke
# them by hand.

on:
  push:
  pull_request:

jobs:
  river:
    name: River backend + consistency checks
    runs-on: ubuntu-latest

    steps:
      - name: Clone project
        uses: actions/checkout@v7

      - name: Install C dependencies
        # libxkbcommon is what the library itself needs; nothing here links X11,
        # and check-subset.sh reads a committed recording rather than building
        # upstream.  libx11-dev is still required, though, because check-all.sh
        # ends by regenerating the keysym tables and util/gen-keysyms.sh reads
        # their values out of a real X11 build -- deliberately, so the numbers
        # are true by construction rather than transcribed.
        run: |
          set -ex
          sudo apt update -y
          sudo apt install -y \
            libxkbcommon-dev \
            libx11-dev \
            #

      - name: Refresh caches once a month
        id: cache-date
        run: |
          set -ex
          echo "date=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
            !~/.stack/pantry
          key: river-${{ runner.os }}-${{ steps.cache-date.outputs.date }}-${{ hashFiles('stack.yaml') }}-${{ hashFiles('*.cabal') }}
          restore-keys: |
            river-${{ runner.os }}-${{ steps.cache-date.outputs.date }}-${{ hashFiles('stack.yaml') }}-
            river-${{ runner.os }}-${{ steps.cache-date.outputs.date }}-

      - name: Update hackage index
        run: stack update

      - name: All consistency checks
        # One script rather than a step per check, so that CI and a developer's
        # shell cannot drift apart -- and because the order still matters:
        # `ghc -e :browse` reads whichever build is registered, so the API
        # check has to follow the build.
        run: ./tests/check-all.sh
